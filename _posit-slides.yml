# Shared Posit theme for the workshop decks. Each deck loads this file with
# `metadata-files`.
format:
  revealjs:
    theme: [default, posit.scss]
    width: 1600
    height: 900
    margin: 0.08
    center: false
    slide-number: true
    transition: none
    highlight-style: github
    code-line-numbers: false
    logo: assets/logos/posit-horiz-full-color.png
    include-in-header: _posit-header.html
